[theme]
dark = "onedark"
light = "onelight"

# theme = "onelight_transparent"
# theme = "onedark_transparent"

[editor]
bufferline = "always"
cursorline = true
line-number = "relative"
# rulers = [80]
soft-wrap = { enable = true }
scroll-lines = 7
true-color = true
rainbow-brackets = true
trim-trailing-whitespace = true
# insert-final-newline = false
popup-border = "all"
# rounded-corners = true
# inline-completion-auto-trigger = false

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
left = ["mode", "spinner", "version-control"]
center = ["file-name", "file-modification-indicator"]
right = [
  "diagnostics",
  "selections",
  "position",
  "position-percentage",
  "file-encoding",
  "file-line-ending",
  "file-type",
]

[editor.lsp]
display-inlay-hints = true
display-progress-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.whitespace.render]
# space = "all"
tab = "all"
newline = "all"

[editor.indent-guides]
render = true
skip-levels = 1

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
"C-[" = ["collapse_selection", "keep_primary_selection"]

"A-j" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"A-k" = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]

W = "move_next_sub_word_start"
B = "move_prev_sub_word_start"
E = "move_next_sub_word_end"

"C-l" = [":open ~/.config/helix/languages.toml"]
"Cmd-l" = [":open ~/.config/helix/languages.toml"]

"C-s" = [":set auto-format false", ":write", ":set auto-format true"]
"Cmd-s" = [":set auto-format false", ":write", ":set auto-format true"]

"C-7" = ["toggle_comments"]
"Cmd-/" = ["toggle_comments"]

"C-g" = [
  ":new",
  ":insert-output lazygit",
  ":buffer-close!",
  ":redraw",
  ":reload-all",
]
"Cmd-g" = [
  ":new",
  ":insert-output lazygit",
  ":buffer-close!",
  ":redraw",
  ":reload-all",
]

# "A-f" = [
#   # ":sh leptosfmt --quiet --experimental-tailwind --override-macro-names rsx rsx_move -- %{buffer_name}",
#   ":sh leptosfmt --quiet -- %{buffer_name}",
#   ":fmt",
# ]

C-d = ":half-page-down-smooth"
C-u = ":half-page-up-smooth"
pageup = ":page-up-smooth"
pagedown = ":page-down-smooth"

[keys.normal.space]
i = [":toggle lsp.display-inlay-hints"]
e = [
  ":sh rm -f /tmp/unique-file",
  ":insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file",
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ":open %sh{cat /tmp/unique-file}",
  ":redraw",
  ":set mouse false",
  ":set mouse true",
]

[keys.select]
W = "extend_next_sub_word_start"
B = "extend_prev_sub_word_start"
E = "extend_next_sub_word_end"

[keys.insert]
"C-space" = ["completion"]
# "A-tab" = "inline_completion_accept"
# "A-n" = "inline_completion_next"
# "A-p" = "inline_completion_prev"
# "A-space" = "inline_completion_trigger"
